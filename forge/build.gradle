plugins {
    id 'multiloader-loader'
}

loom {
    convertAw2At(tasks.named('jar', Jar), ["${project.mod_id}.classtweaker"])
}

repositories {
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    forgeUserdev "net.minecraftforge:forge:${project.forge_version}:userdev"

    implementation("net.blay09.mods:balm-forge:${project.balm_version}") {
        changing = project.balm_version.contains('SNAPSHOT')
    }
}