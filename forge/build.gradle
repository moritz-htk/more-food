plugins {
    id 'multiloader-loader'
    id 'com.hypherionmc.modutils.modpublisher'
}

loom {
    convertAw2At(tasks.named('jar', Jar), ["${project.mod_id}.classtweaker"])
}

repositories {
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    forgeUserdev "net.minecraftforge:forge:${project.forge_version}:userdev"

    implementation("net.blay09.mods:balm-forge:${project.balm_version}") {
        changing = project.balm_version.contains('SNAPSHOT')
    }
}

publisher {
    apiKeys {
        curseforge System.getenv('CURSEFORGE_TOKEN')
        modrinth System.getenv('MODRINTH_TOKEN')
    }

    setDisplayName("[Forge ${project.minecraft_version}] More Food ${project.version}")
    setVersion(project.version)
    setVersionType('release')
    setGameVersions(project.minecraft_version)
    setLoaders(project.name)
    setChangelog(rootProject.file('changelog.md').text)

    setArtifact(tasks.jar)

    curseDepends {
        required 'balm'
    }

    modrinthDepends {
        required 'balm'
    }

    setCurseID('874343')
    setModrinthID('kReQ7M8K')
}