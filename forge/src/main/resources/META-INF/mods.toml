modLoader="javafml"
loaderVersion="${forge_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_github}/issues"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    updateJSONURL="https://api.modrinth.com/updates/more-food-xd/forge_updates.json"
    displayURL="${mod_homepage}"
    logoFile="${mod_icon}"
    credits="${mod_credits}"
    authors="${mod_author}"
    description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="balm"
    mandatory=true
    versionRange="[${balm_version},)"
    ordering="NONE"
    side="BOTH"