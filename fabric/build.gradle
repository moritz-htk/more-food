plugins {
    id 'multiloader-loader'
}

fabricApi {
    configureDataGeneration {
        client = true
        outputDirectory = project(':common').file('src/main/generated')
        addToResources = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation("net.blay09.mods:balm-fabric:${project.balm_version}") {
        changing = project.balm_version.contains('SNAPSHOT')
    }
}