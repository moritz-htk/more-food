plugins {
    id 'multiloader-loader'
}

loom {
    convertAw2At(tasks.named('jar', Jar), ["${project.mod_id}.classtweaker"])
}

repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases/'
    }
}

dependencies {
    forgeUserdev "net.neoforged:neoforge:${project.neoforge_version}:userdev"

    implementation("net.blay09.mods:balm-neoforge:${project.balm_version}") {
        changing = project.balm_version.contains('SNAPSHOT')
    }
}